<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #0f172a !important;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 900;
            margin-top: 50px;
            background: linear-gradient(to right, #AEC6CF, #D1BFF9, #FFD1DC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        #container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            padding: 50px 20px;
            width: 100%;
            max-width: 1400px;
        }

        .card {
            background: white !important;
            color: #1a1a1a !important;
            border-radius: 20px;
            padding: 35px 25px;
            flex: 1;
            min-width: 250px;
            min-height: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
        }

        .card:hover {
            transform: translateY(-15px) scale(1.05) !important;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6) !important;
        }

        .card h2 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: #0f172a;
            text-align: center;
        }

        #time { 
            font-size: 4.5rem; 
            font-weight: 900; 
            margin: 25px 0; 
            color: #0f172a; 
            text-align: center;
        }

        button {
            cursor: pointer !important;
            border: none;
            transition: all 0.2s ease !important;
        }

        button:hover {
            filter: brightness(0.8) !important;
            transform: scale(1.1) !important;
        }

        .btn-group-row {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: auto;
        }

        .btn-timer {
            flex: 1;
            padding: 12px 5px;
            border-radius: 10px;
            font-weight: bold;
            color: white;
            font-size: 0.9rem;
        }

        .btn-start { background-color: #AEC6CF !important; }
        .btn-pause { background-color: #FFD1DC !important; }
        .btn-reset { background-color: #B39EB5 !important; }

        .btn-add { 
            background-color: #D1BFF9 !important; 
            color: white; 
            padding: 10px 30px; 
            border-radius: 10px; 
            font-weight: bold; 
            margin-top: 10px;
        }

        .btn-quote { 
            background-color: #A0DEEE !important; 
            color: white; 
            padding: 12px; 
            border-radius: 10px; 
            width: 100%; 
            font-weight: bold; 
            margin-top: auto; 
        }

        #progress-detail, #quote {
            font-size: 1.3rem !important;
            font-weight: 700 !important;
            color: #475569 !important;
            text-align: center;
        }

        #progress-detail { margin-top: auto; }
        #quote { margin: auto; padding: 0 10px; }

        .progress-container { position: relative; width: 110px; height: 110px; margin: 20px auto; }
        svg { transform: rotate(-90deg); width: 110px; height: 110px; }
        circle { fill: none; stroke-width: 10; stroke-linecap: round; }
        .bg-circle { stroke: #f1f5f9; }
        .progress-circle {
            stroke: #936ED4;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            transition: stroke-dashoffset 1s ease-in-out;
        }

        input { 
            border: 2px solid #e2e880; 
            padding: 12px; 
            border-radius: 10px; 
            width: 100%; 
            box-sizing: border-box; 
            color: #333; 
            text-align: center;
        }

        #task-list { width: 100%; margin-top: 20px; }
        
        footer {
            margin-top: auto;
            padding: 40px;
            width: 100%;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 class="main-title">Study Hub</h1>

    <div id="container">
        <!-- Daily Goal -->
        <div class="card">
            <h2>Daily Goal</h2>
            <div class="progress-container">
                <svg viewBox="0 0 100 100">
                    <circle class="bg-circle" cx="50" cy="50" r="45"></circle>
                    <circle class="progress-circle" id="circle-bar" cx="50" cy="50" r="45"></circle>
                </svg>
                <div id="percent-text" class="absolute inset-0 flex items-center justify-center font-black text-xl text-black">0%</div>
            </div>
            <p id="progress-detail">0/4 sessions done</p>
        </div>

        <!-- Pomodoro -->
        <div class="card">
            <h2>Pomodoro</h2>
            <div id="time">15:00</div>
            <div class="btn-group-row">
                <button onclick="startTimer()" class="btn-timer btn-start">Start</button>
                <button onclick="pauseTimer()" class="btn-timer btn-pause">Pause</button>
                <button onclick="resetTimer()" class="btn-timer btn-reset">Reset</button>
            </div>
        </div>

        <!-- To-do -->
        <div class="card">
            <h2>To-do List</h2>
            <input type="text" id="todo-input" placeholder="New task...">
            <button onclick="addTodo()" class="btn-add">+</button>
            <ul id="task-list" class="text-left space-y-3 w-full"></ul>
        </div>

        <!-- Motivation -->
        <div class="card">
            <h2>Motivation</h2>
            <p id="quote">"Never let anyone underestimate you. If you really want it, you can have it easily by working the best you can."</p>
            <button onclick="getQuote()" class="btn-quote">New Quote</button>
        </div>
    </div>

    <footer>
        <p class="text-white text-lg">Built with ✨ by <span class="font-bold">Aishah</span></p>
    </footer>

        <script>
    let timeLeft = 15 * 60; 
    let timerId = null;
    const sessionsGoal = 4;

    function updateTimerDisplay() {
       const mins = Math.floor(timeLeft / 60);
       const secs = timeLeft % 60;
       const display = document.getElementById('time');
       if(display) {
       display.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
        }
    }

    function startTimer() {
        if (timerId) return;
        timerId = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerId);
                timerId = null;
                updateProgress();
                alert("Time is up! Session complete.");
            }
        }, 1000);
    }

    function pauseTimer() { clearInterval(timerId); timerId = null; }
    function resetTimer() { pauseTimer(); timeLeft = 15 * 60; updateTimerDisplay(); }

    function updateProgress() {
        let completed = parseInt(localStorage.getItem('sessionsCompleted')) || 0;
        completed++;
        localStorage.setItem('sessionsCompleted', completed);
        renderCircle(completed);
        
        const count = 200;
        const defaults = { origin: { y: 0.7 } };

        function fire(particleRatio, opts) {
            confetti({
                ...defaults,
                ...opts,
                particleCount: Math.floor(count * particleRatio)
            });
        }

        fire(0.25, { spread: 26, startVelocity: 55 });
        fire(0.2, { spread: 60 });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
        fire(0.1, { spread: 120, startVelocity: 45 });
        
    }

    function renderCircle(completed) {
        const circle = document.getElementById('circle-bar');
        const percentText = document.getElementById('percent-text');
        const detailText = document.getElementById('progress-detail');
        
        if(!circle || !percentText || !detailText) return;

        const percentage = Math.min((completed / sessionsGoal) * 100, 100);
        const offset = 283 - (283 * percentage / 100);
        
        circle.style.strokeDashoffset = offset;
        percentText.innerText = `${Math.round(percentage)}%`;
        detailText.innerText = `${completed}/${sessionsGoal} sessions done`;
    }

    updateTimerDisplay();
    renderCircle(parseInt(localStorage.getItem('sessionsCompleted')) || 0);

    function addTodo() {
        const input = document.getElementById('todo-input');
        const list = document.getElementById('task-list');
        
        if (input && input.value.trim() !== '') {
            const li = document.createElement('li');
            
            li.style.display = "flex";
            li.style.justifyContent = "space-between";
            li.style.alignItems = "center";
            li.style.width = "100%";
            li.style.padding = "10px 0";
            li.style.borderBottom = "1px solid #f1f5f9";
            li.style.color = "#475569";

            li.innerHTML = `
                <span style="flex-grow: 1; text-align: left;">${input.value}</span>
                <button 
                    onclick="this.parentElement.remove()" 
                    style="
                        background-color: #FFB1B1; 
                        color: white; 
                        border: none; 
                        border-radius: 50%; 
                        width: 24px; 
                        height: 24px; 
                        display: flex; 
                        align-items: center; 
                        justify-content: center; 
                        cursor: pointer; 
                        font-weight: bold;
                        font-size: 14px;
                        margin-left: 10px;
                        flex-shrink: 0;
                    "
                >
                    &times;
                </button>
            `;
            
            list.appendChild(li);
            input.value = '';
        }
    }

    function getQuote() {
        const quotes = [
            "Believe you can and you're halfway there.",
            "The only way to do great work is to love what you do.",
            "Success is not final, failure is not fatal: it is the courage to continue that counts.",
            "Don't watch the clock; do what it does. Keep going.",
            "Unless you really want it, you'll work the best you can to achieve it.",
        ];
        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
        const quoteEl = document.getElementById('quote');
        if(quoteEl) quoteEl.innerText = `"${randomQuote}"`;
    }
</script>
