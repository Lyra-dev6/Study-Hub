<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub</title>
    <script src="https://tailwindcss.com"></script>
    <style>
       
        body {
            background-color: #0a0f1d !important;
            color: white !important;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #container {
            display: flex !important;
            flex-direction: row !important;
            justify-content: center !important;
            align-items: flex-start !important;
            gap: 20px !important;
            padding: 50px 20px !important;
            width: 100% !important;
            max-width: 1400px !important;
        }

        .card {
            flex: 1 !important;
            min-width: 250px !important;
            max-width: 320px !important;
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(15px) !important;
            -webkit-backdrop-filter: blur(15px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 20px !important;
            padding: 25px !important;
            text-align: center !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3) !important;
        }

        .progress-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 15px auto;
        }
        svg { transform: rotate(-90deg); width: 100px; height: 100px; }
        circle { fill: none; stroke-width: 8; stroke-linecap: round; }
        .bg-circle { stroke: rgba(255,255,255,0.1); }
        .progress-circle {
            stroke: #818cf8;
            stroke-dasharray: 283;
            stroke-dashoffset: 70;
        }
    </style>
</head>
<body>

    <h1 class="text-4xl font-bold mt-10">Study Hub</h1>

    <div id="container">
    
        <div class="card">
            <h2 class="text-lg font-semibold">Goal</h2>
            <div class="progress-container">
                <svg viewBox="0 0 100 100">
                    <circle class="bg-circle" cx="50" cy="50" r="45"></circle>
                    <circle class="progress-circle" cx="50" cy="50" r="45"></circle>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center font-bold">75%</div>
            </div>
            <p class="text-xs opacity-50">3/4 Sessions</p>
        </div>

        <div class="card">
            <h2 class="text-lg font-semibold">Timer</h2>
            <div id="time" class="text-5xl font-bold my-5">25:00</div>
            <div class="flex gap-2 justify-center">
                <button class="bg-white/10 px-3 py-1 rounded">Start</button>
                <button class="bg-white/10 px-3 py-1 rounded">Reset</button>
            </div>
        </div>


        <div class="card">
            <h2 class="text-lg font-semibold mb-4">Tasks</h2>
            <div class="flex gap-2">
                <input type="text" placeholder="Task..." class="bg-white/10 border-none rounded p-2 w-full text-white">
                <button class="bg-indigo-500 px-3 rounded">+</button>
            </div>
        </div>

        <div class="card">
            <h2 class="text-lg font-semibold">Vibe</h2>
            <p class="italic text-sm mt-4">"Keep going, you're doing great!"</p>
        </div>
    </div>

</body>
</html>
