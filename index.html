<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
    
        body {
            background-color: #0a0f1d; /* Deep dark background so white cards pop */
            color: #333; /* Darker text for readability on white cards */
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: white;
            margin-top: 40px;
            font-size: 2.5rem;
            font-weight: bold;
        }


        #container {
            display: flex;
            flex-direction: row; 
            flex-wrap: wrap;     
            justify-content: center;
            gap: 20px;
            padding: 40px 20px;
            width: 100%;
            max-width: 1300px;
        }

        .card {
            flex: 1;
            min-width: 280px;
            max-width: 320px;
            background: white !important; /* Forces solid white */
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.03);
        }

        .card h2 {
            color: #1a1a1a;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid #e5e7eb;
            cursor: pointer;
        }

        button:hover {
            background-color: #e5e7eb;
            transform: scale(1.05);
        }

        .btn-add {
            background-color: #4f46e5;
            color: white;
        }

        .progress-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 10px auto;
        }
        svg { transform: rotate(-90deg); width: 100px; height: 100px; }
        circle { fill: none; stroke-width: 8; stroke-linecap: round; }
        .bg-circle { stroke: #f3f4f6; }
        .progress-circle {
            stroke: #4f46e5;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            transition: stroke-dashoffset 1s ease-in-out;
        }

        input {
            border: 1px solid #ddd;
            padding: 8px;
            border-radius: 6px;
            width: 100%;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>Study Hub</h1>

    <div id="container">
        
        <div class="card">
            <h2>Daily Goal</h2>
            <div class="progress-container">
                <svg viewBox="0 0 100 100">
                    <circle class="bg-circle" cx="50" cy="50" r="45"></circle>
                    <circle class="progress-circle" id="circle-bar" cx="50" cy="50" r="45"></circle>
                </svg>
                <div id="percent-text" class="absolute inset-0 flex items-center justify-center font-bold text-lg">0%</div>
            </div>
            <p id="progress-detail" class="text-xs text-gray-500 mt-2">0/4 sessions completed</p>
        </div>

    
            <h2>Pomodoro Timer</h2>
            <div id="time" class="text-5xl font-bold my-4">25:00</div>
            <div class="flex justify-center gap-2">
                <button onclick="startTimer()">Start</button>
                <button onclick="pauseTimer()">Pause</button>
                <button onclick="resetTimer()">Reset</button>
            </div>
        </div>

    
        <div class="card">
            <h2>To-do List</h2>
            <div class="flex gap-2">
                <input type="text" id="todo-input" placeholder="Add task...">
                <button onclick="addTodo()" class="btn-add">+</button>
            </div>
            <ul id="task-list" class="mt-4 text-left text-sm space-y-2"></ul>
        </div>

    
        <div class="card">
            <h2>Motivation</h2>
            <p id="quote" class="italic text-gray-600">"Your only limit is your mind."</p>
            <button onclick="getQuote()" class="mt-4 text-xs text-indigo-600 border-none bg-transparent hover:bg-transparent">New Quote</button>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;
        const sessionsGoal = 4;

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('time').innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerId) return;
            timerId = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    updateProgress();
                    alert("Great job! Session complete.");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerId);
            timerId = null;
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = 25 * 60;
            updateTimerDisplay();
        }

        function updateProgress() {
            let completed = parseInt(localStorage.getItem('sessionsCompleted')) || 0;
            completed++;
            localStorage.setItem('sessionsCompleted', completed);
            renderCircle(completed);
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        function renderCircle(completed) {
            const circle = document.getElementById('circle-bar');
            const percentText = document.getElementById('percent-text');
            const detailText = document.getElementById('progress-detail');
            let percentage = Math.min((completed / sessionsGoal) * 100, 100);
            const offset = 283 - (percentage / 100 * 283);
            circle.style.strokeDashoffset = offset;
            percentText.innerText = `${Math.round(percentage)}%`;
            detailText.innerText = `${completed}/${sessionsGoal} sessions completed`;
        }

        function addTodo() {
            const input = document.getElementById('todo-input');
            if (!input.value) return;
            const li = document.createElement('li');
            li.className = "flex justify-between items-center p-2 bg-gray-50 rounded";
            li.innerHTML = `<span>${input.value}</span> <button onclick="this.parentElement.remove()" class="text-red-500 border-none bg-transparent p-0">✕</button>`;
            document.getElementById('task-list').appendChild(li);
            input.value = "";
        }

        function getQuote() {
            const quotes = ["Success is daily.", "Do it now.", "Keep pushing.", "Stay focused."];
            document.getElementById('quote').innerText = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;
        }

        window.onload = () => {
            const completed = parseInt(localStorage.getItem('sessionsCompleted')) || 0;
            renderCircle(completed);
        };
    </script>
</body>
</html>
