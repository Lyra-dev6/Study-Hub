<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub</title>
    <link rel="stylesheet" href="styles.css">

    <body>
        <h1>Study Hub</h1>
        <div id="container">
            <div id="timer-card" class="shadow-xl/20">
                <h2>Pomodoro Timer</h2>
                <div id="time">25:00</div>

                <div class="buttons">
                    <button class="transition duration-300 ease-in-out">Start</button>
                    <button class="transition duration-300 ease-in-out">Pause</button>
                    <button class="transition duration-300 ease-in-out">Reset</button>
                </div>
            </div>

            <div id="todo-card" class="shadow-xl/20">
                <h2>To-do List</h2>

                <input type="text" placeholder="Add a new task">
                <button class="transition duration-300 ease-in-out">Add</button>

                <ul id="task-list">
                </ul>
            </div>

                <div id="quotes-card" class="shadow-xl/20">
                    <h2>Motivational Quotes</h2>

                    <p id="quote">Click the button for a new motivational quote!</p>

                    <button class="transition duration-300 ease-in-out">New Quote</button>
                </div>
            </div>
        </div>
        <footer style="text-align: center; padding: 40px; margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.1);">
          <p style="color: white; font-size: 20px; font-family: sans-serif;">
            Built with ✨ by 
            <a href="https://github.com" style="color: white; font-weight: bold; text-decoration: none;">Aishah</a>
          </p>
        </footer>
    </body>
    <script src="script.js"></script>
</html>
