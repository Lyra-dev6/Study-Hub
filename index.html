<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
   <style>
    
    body {
        background-color: #0f172a; 
        color: white;
        font-family: sans-serif;
    }

    #container {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;     
        justify-content: center;
        gap: 20px;
        padding: 40px 20px;
        max-width: 1400px;
        margin: 0 auto;
    }

    
    .card {
        flex: 1;
        min-width: 280px;
        max-width: 350px;
        background: rgba(255, 255, 255, 0.05); 
        border-radius: 15px;
        padding: 20px;
        text-align: center;
        transition: transform 0.3s ease;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .card:hover {
        transform: scale(1.05);
    }


    .progress-container {
        position: relative;
        width: 100px;
        height: 100px;
        margin: 15px auto;
    }
    svg { transform: rotate(-90deg); width: 100px; height: 100px; }
    circle { fill: none; stroke-width: 8; stroke-linecap: round; }
    .bg-circle { stroke: rgba(255,255,255,0.1); }
    .progress-circle {
        stroke: #6366f1; /* Indigo progress bar */
        stroke-dasharray: 283;
        stroke-dashoffset: 70;
        transition: stroke-dashoffset 1s ease;
    }
</style>

<div id="container">
    
    <div id="progress-card" class="card">
        <h2>Daily Goal</h2>
        <div class="progress-container">
            <svg viewBox="0 0 100 100">
                <circle class="bg-circle" cx="50" cy="50" r="45"></circle>
                <circle class="progress-circle" cx="50" cy="50" r="45"></circle>
            </svg>
            <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: bold;">75%</div>
        </div>
        <p style="font-size: 0.8rem; opacity: 0.6;">Keep going!</p>
    </div>

    <div id="timer-card" class="card">
        <h2>Pomodoro</h2>
        <div id="time" style="font-size: 2.5rem; margin: 15px 0;">25:00</div>
        <div class="flex justify-center gap-2">
            <button onclick="startTimer()" class="bg-white/10 p-2 rounded">Start</button>
            <button onclick="pauseTimer()" class="bg-white/10 p-2 rounded">Pause</button>
            <button onclick="resetTimer()" class="bg-white/10 p-2 rounded">Reset</button>
        </div>
    </div>


    <div id="todo-card" class="card">
        <h2>To-do List</h2>
        <div style="display: flex; gap: 5px; margin-top: 10px;">
            <input type="text" id="todo-input" placeholder="New task" style="background: rgba(255,255,255,0.1); border: none; border-radius: 5px; color: white; padding: 5px; width: 70%;">
            <button onclick="addTodo()" style="background: #6366f1; padding: 5px 10px; border-radius: 5px;">Add</button>
        </div>
        <ul id="task-list" style="margin-top: 15px; text-align: left; list-style: none; padding: 0;"></ul>
    </div>

    <div id="quotes-card" class="card">
        <h2>Motivation</h2>
        <p id="quote" style="font-style: italic; min-height: 50px; margin-top: 15px;">"Success is a journey."</p>
        <button onclick="getQuote()" style="margin-top: 10px; font-size: 0.7rem; opacity: 0.5;">New Quote</button>
    </div>
</div>
