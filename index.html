<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }


        .main-title {
            font-size: 4rem;
            font-weight: 900;
            margin-top: 50px;
            background: linear-gradient(to right, #AEC6CF, #D1BFF9, #FFD1DC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        
        #container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch; 
            gap: 20px;
            padding: 50px 20px;
            width: 100%;
            max-width: 1400px;
        }

        .card {
            background: white !important;
            color: #1a1a1a !important;
            border-radius: 20px;
            padding: 35px 25px;
            flex: 1; /* Forces 4 equal columns */
            min-width: 250px;
            min-height: 450px; /* Makes them longer */
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover { transform: translateY(-12px); }

        .card h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: #0f172a;
        }

        .btn-start { background-color: #AEC6CF; color: white; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; }
        .btn-pause { background-color: #FFD1DC; color: white; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; }
        .btn-reset { background-color: #B39EB5; color: white; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; }
        .btn-add { background-color: #D1BFF9; color: white; padding: 0 20px; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .btn-add:hover { background-color: #936ED4; }
        .btn-quote { background-color: #A0DEEE; color: white; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 20px; }

        /* PROGRESS CIRCLE */
        .progress-container { position: relative; width: 110px; height: 110px; margin: 20px auto; }
        svg { transform: rotate(-90deg); width: 110px; height: 110px; }
        circle { fill: none; stroke-width: 10; stroke-linecap: round; }
        .bg-circle { stroke: #f1f5f9; }
        .progress-circle {
            stroke: #936ED4;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            transition: stroke-dashoffset 1s ease-in-out;
        }

        input { border: 2px solid #e2e8f0; padding: 12px; border-radius: 10px; width: 100%; color: #333; }
        #time { font-size: 4rem; font-weight: 900; margin: 25px 0; color: #0f172a; }
        
    
        footer {
            margin-top: auto;
            padding: 40px;
            width: 100%;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 class="main-title">Study Hub</h1>

    <div id="container">
        <!-- Goal Card -->
        <div class="card">
            <h2>Daily Goal</h2>
            <div class="progress-container">
                <svg viewBox="0 0 100 100">
                    <circle class="bg-circle" cx="50" cy="50" r="45"></circle>
                    <circle class="progress-circle" id="circle-bar" cx="50" cy="50" r="45"></circle>
                </svg>
                <div id="percent-text" class="absolute inset-0 flex items-center justify-center font-black text-xl">0%</div>
            </div>
            <p id="progress-detail" class="text-sm text-gray-400">0/4 sessions done</p>
        </div>

        <!-- Timer Card -->
        <div class="card">
            <h2>Pomodoro</h2>
            <div id="time">25:00</div>
            <div class="flex flex-col gap-2">
                <button onclick="startTimer()" class="btn-start">Start</button>
                <div class="flex gap-2">
                    <button onclick="pauseTimer()" class="btn-pause">Pause</button>
                    <button onclick="resetTimer()" class="btn-reset">Reset</button>
                </div>
            </div>
        </div>

        <!-- Tasks Card -->
        <div class="card">
            <h2>To-do List</h2>
            <div class="flex gap-2 mt-4">
                <input type="text" id="todo-input" placeholder="New task...">
                <button onclick="addTodo()" class="btn-add">+</button>
            </div>
            <ul id="task-list" class="mt-6 text-left space-y-3"></ul>
        </div>

        <!-- Quote Card -->
        <div class="card">
            <h2>Inspiration</h2>
            <p id="quote" class="italic text-gray-500 text-lg leading-relaxed">"Success is built on small daily wins."</p>
            <button onclick="getQuote()" class="btn-quote">New Quote</button>
        </div>
    </div>

    <footer>
        <p class="text-white text-lg">Built with ✨ by <span class="font-bold">Aishah</span></p>
    </footer>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;
        const sessionsGoal = 4;

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('time').innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerId) return;
            timerId = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    updateProgress();
                    alert("Time is up! Great job.");
                }
            }, 1000);
        }

        function pauseTimer() { clearInterval(timerId); timerId = null; }
        function resetTimer() { pauseTimer(); timeLeft = 25 * 60; updateTimerDisplay(); }

        function updateProgress() {
            let completed = parseInt(localStorage.getItem('sessionsCompleted')) || 0;
            completed++;
            localStorage.setItem('sessionsCompleted', completed);
            renderCircle(completed);
            confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });
        }

        function renderCircle(completed) {
            const circle = document.getElementById('circle-bar');
            const percentText = document.getElementById('percent-text');
            const detailText = document.getElementById('progress-detail');
            let percentage = Math.min((completed / sessionsGoal) * 100, 100);
            const offset = 283 - (percentage / 100 * 283);
            if(circle) circle.style.strokeDashoffset = offset;
            if(percentText) percentText.innerText = `${Math.round(percentage)}%`;
            if(detailText) detailText.innerText = `${completed}/${sessionsGoal} sessions done`;
        }

        function addTodo() {
            const input = document.getElementById('todo-input');
            if (!input.value) return;
            const li = document.createElement('li');
            li.className = "flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100";
            li.innerHTML = `<span class="font-medium text-gray-700">${input.value}</span> <button onclick="this.parentElement.remove()" class="text-red-400 font-bold hover:text-red-600 transition">✕</button>`;
            document.getElementById('task-list').appendChild(li);
            input.value = "";
        }

        function getQuote() {
            const quotes = ["Be better than yesterday.", "Focus on your goals.", "Success is a choice.", "Keep going!"];
            document.getElementById('quote').innerText = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;
        }

        window.onload = () => {
            const completed = parseInt(localStorage.getItem('sessionsCompleted')) || 0;
            renderCircle(completed);
        };
    </script>
</body>
</html>
