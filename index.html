<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Motivator</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
        }
        body {
            background-color: #0f172a !important;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .main-title {
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 40px;
            background: linear-gradient(to right, #AEC6CF, #D1BFF9, #FFD1DC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            position: absolute;
            top: 30px;
        }
        #container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start; 
            gap: 15px;
            padding: 20px 15px;
            width: 100%;
            max-width: 1300px;
            flex-wrap: nowrap;
        }
        .card {
            background: white !important;
            color: #1a1a1a !important;
            border-radius: 18px;
            padding: 20px 18px; 
            flex: 1;
            min-width: 0;
            min-height: 380px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
        }
        .card:hover {
            transform: translateY(-10px) scale(1.02) !important;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6) !important;
        }
        .card h2 {
            font-size: 1.5rem; 
            font-weight: 800;
            margin-bottom: 10px;
            color: #0f172a;
            text-align: center;
        }
        #time {
            font-size: 3.2rem; 
            font-weight: 900;
            margin: 15px 0;
            color: #0f172a;
            text-align: center;
        }
        button {
            cursor: pointer !important;
            border: none;
            transition: all 0.2s ease !important;
        }
        button:hover {
            filter: brightness(0.8) !important;
            transform: scale(1.05) !important;
        }
        .btn-group-row {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-top: auto;
        }
        .btn-timer {
            flex: 1;
            padding: 9px 4px;
            border-radius: 9px;
            font-weight: bold;
            color: white;
            font-size: 0.8rem;
        }
        .btn-start { background-color: #AEC6CF !important; }
        .btn-pause { background-color: #FFD1DC !important; }
        .btn-reset { background-color: #B39EB5 !important; }
        .btn-add {
            background-color: #D1BFF9 !important;
            color: white;
            padding: 8px 20px;
            border-radius: 9px;
            font-weight: bold;
            margin-top: 8px;
            font-size: 0.85rem;
        }
        .btn-quote {
            background-color: #A0DEEE !important;
            color: white;
            padding: 10px;
            border-radius: 9px;
            width: 100%;
            font-weight: bold;
            margin-top: auto;
            font-size: 0.85rem;
        }
        .btn-delete {
            background-color: #EF4444 !important;
            color: white;
            padding: 0;
            border-radius: 8px;
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .btn-delete:hover {
            filter: brightness(0.85) !important;
            transform: scale(1.15) !important;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }
        #progress-detail, #quote {
            font-size: 1rem !important;
            font-weight: 700 !important;
            color: #475569 !important;
            text-align: center;
        }
        #progress-detail { margin-top: auto; margin-bottom: 10px; }
        #quote { margin: auto; padding: 0 5px; }
        
        .progress-container {
            position: relative;
            width: 80px; 
            height: 80px;
            margin: 10px auto;
        }
        svg {
            transform: rotate(-90deg);
            width: 80px;
            height: 80px;
        }
        circle {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
        }
        .bg-circle { stroke: #f1f5f9; }
        .progress-circle {
            stroke: #936ED4;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            transition: stroke-dashoffset 1s ease-in-out;
        }
        input {
            border: 2px solid #e2e8f0;
            padding: 9px;
            border-radius: 9px;
            width: 100%;
            box-sizing: border-box;
            color: #333;
            text-align: center;
            font-size: 0.85rem;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
            text-slate-600;
            gap: 8px;
        }
        .task-text {
            flex-grow: 1;
            text-align: left;
            font-size: 0.85rem;
            word-break: break-word;
        }
        #task-list {
            width: 100%;
            margin-top: 10px;
            overflow-y: auto; 
            max-height: 150px;
        }
        footer {
            padding: 20px;
            width: 100%;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            position: absolute;
            bottom: 0;
        }

        @media (max-width: 768px) {
            #container { flex-direction: column; align-items: center; }
            .card { min-width: 90%; min-height: auto; }
            .main-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <h1 class="main-title">Smart Task Motivator</h1>

    <div id="container">
        <!-- Daily Goal -->
        <div class="card">
            <h2>Daily Goal</h2>
            <div class="progress-container">
                <svg viewBox="0 0 100 100">
                    <circle class="bg-circle" cx="50" cy="50" r="45"></circle>
                    <circle class="progress-circle" id="circle-bar" cx="50" cy="50" r="45"></circle>
                </svg>
                <div id="percent-text" class="absolute inset-0 flex items-center justify-center font-black text-lg text-black">0%</div>
            </div>
            <p id="progress-detail">0/4 sessions done</p>
            <button onclick="resetProgress()" class="btn-quote" style="background-color: #FFB3BA !important; margin-top: 10px; padding: 5px 0; font-size: 0.8rem;">Reset</button>
        </div>

        <!-- Pomodoro -->
        <div class="card">
            <h2>Pomodoro</h2>
            <div id="time">5:00</div>
            <div class="btn-group-row">
                <button onclick="startTimer()" class="btn-timer btn-start">Start</button>
                <button onclick="pauseTimer()" class="btn-timer btn-pause">Pause</button>
                <button onclick="resetTimer()" class="btn-timer btn-reset">Reset</button>
            </div>
        </div>

        <!-- To-do -->
        <div class="card">
            <h2>To-do List</h2>
            <input type="text" id="todo-input" placeholder="New task...">
            <button onclick="addTodo()" class="btn-add">+</button>
            <ul id="task-list" class="w-full"></ul>
        </div>

        <!-- Motivation -->
        <div class="card">
            <h2>Motivation</h2>
            <p id="quote">"Never let anyone underestimate you. If you really want it, you can have it easily."</p>
            <button onclick="getQuote()" class="btn-quote">New Quote</button>
        </div>
    </div>

    <footer>
        <p class="text-white text-md">Built with ✨ by <span class="font-bold">Aishah</span></p>
    </footer>

    <script>
        let timeLeft = 5 * 60;
        let timerId = null;
        const sessionsGoal = 4;

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const display = document.getElementById('time');
            if(display) {
                display.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }

        function startTimer() {
            if (timerId) return;
            timerId = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    updateProgress();
                    alert("Time is up! Session complete.");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerId);
            timerId = null;
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = 5 * 60;
            updateTimerDisplay();
        }

        function updateProgress() {
            let completed = parseInt(localStorage.getItem('sessionsCompleted')) || 0;
            completed++;
            localStorage.setItem('sessionsCompleted', completed);
            renderCircle(completed);
            
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function resetProgress() {
            localStorage.removeItem('sessionsCompleted');
            renderCircle(0);
        }

        function renderCircle(completed) {
            const circle = document.getElementById('circle-bar');
            const percentText = document.getElementById('percent-text');
            const detailText = document.getElementById('progress-detail');
            if(!circle || !percentText || !detailText) return;
            
            const percentage = Math.min((completed / sessionsGoal) * 100, 100);
            const offset = 283 - (283 * percentage / 100);
            circle.style.strokeDashoffset = offset;
            percentText.innerText = `${Math.round(percentage)}%`;
            detailText.innerText = `${completed}/${sessionsGoal} sessions done`;
        }

        function addTodo() {
            const input = document.getElementById('todo-input');
            const list = document.getElementById('task-list');
            if (input && input.value.trim() !== '') {
                const li = document.createElement('li');
                li.className = "task-item";
                li.innerHTML = `
                    <span class="task-text">${input.value}</span>
                    <button onclick="this.parentElement.remove()" class="btn-delete">&times;</button>
                `;
                list.appendChild(li);
                input.value = '';
            }
        }

        function getQuote() {
            const quotes = [
                "Believe you can and you're halfway there.",
                "The only way to do great work is to love what you do.",
                "Success is not final, failure is not fatal.",
                "Don't watch the clock; do what it does. Keep going.",
                "Focus on being productive instead of busy."
            ];
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            const quoteEl = document.getElementById('quote');
            if(quoteEl) quoteEl.innerText = `"${randomQuote}"`;
        }

        updateTimerDisplay();
        renderCircle(parseInt(localStorage.getItem('sessionsCompleted')) || 0);
    </script>
</body>
</html>
