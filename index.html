<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 class="main-title">Study Hub</h1>

    <div id="container">
        <!-- Daily Goal Card -->
        <div class="card">
            <h2>Daily Goal</h2>
            <div class="progress-container">
                <svg viewBox="0 0 100 100">
                    <circle class="bg-circle" cx="50" cy="50" r="45"></circle>
                    <circle class="progress-circle" id="circle-bar" cx="50" cy="50" r="45"></circle>
                </svg>
                <div id="percent-text" class="percent-display">0%</div>
            </div>
            <p id="progress-detail" class="detail-text">0/4 sessions done</p>
        </div>

        <!-- Timer Card -->
        <div class="card">
            <h2>Pomodoro</h2>
            <div id="time">25:00</div>
            <div class="button-group">
                <button onclick="startTimer()" class="btn-start">Start</button>
                <button onclick="pauseTimer()" class="btn-pause">Pause</button>
                <button onclick="resetTimer()" class="btn-reset">Reset</button>
            </div>
        </div>

        <!-- To-do List Card -->
        <div class="card">
            <h2>Tasks</h2>
            <div class="input-group">
                <input type="text" id="todo-input" placeholder="New task...">
                <button onclick="addTodo()" class="btn-add">+</button>
            </div>
            <ul id="task-list"></ul>
        </div>

        <!-- Quotes Card -->
        <div class="card">
            <h2>Inspiration</h2>
            <p id="quote">"Success starts with self-discipline."</p>
            <button onclick="getQuote()" class="btn-quote">New Quote</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://jsdelivr.net"></script>
</body>
</html>
