<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub</title>
   
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Study Hub</h1>
    <div id="container">
        
        <div id="streak-card" class="shadow-xl/20 transition duration-300 hover:scale-105" style="text-align: center; padding: 20px; margin-bottom: 20px; background: rgba(255,255,255,0.05); border-radius: 15px;">
            <h2 style="margin: 0;">🔥 Streak: <span id="streak-count">0</span> Days</h2>
        </div>

        <div id="timer-card" class="shadow-xl/20">
            <h2>Pomodoro Timer</h2>
            <div id="time">25:00</div>
            <div class="buttons">
                <button class="transition duration-300 ease-in-out hover:scale-110" onclick="startTimer()">Start</button>
                <button class="transition duration-300 ease-in-out hover:scale-110" onclick="pauseTimer()">Pause</button>
                <button class="transition duration-300 ease-in-out hover:scale-110" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <div id="todo-card" class="shadow-xl/20">
            <h2>To-do List</h2>
            <input type="text" id="todo-input" placeholder="Add a new task">
            <button class="transition duration-300 ease-in-out hover:scale-110" onclick="addTodo()">Add</button>
            <ul id="task-list"></ul>
        </div>

        <div id="quotes-card" class="shadow-xl/20">
            <h2>Motivational Quotes</h2>
            <p id="quote">Click the button for a new motivational quote!</p>
            <button class="transition duration-300 ease-in-out hover:scale-110" onclick="getQuote()">New Quote</button>
        </div>
    </div>

    <footer style="text-align: center; padding: 40px; margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.1);">
        <p style="color: white; font-size: 20px; font-family: sans-serif;">
            Built with ✨ by <a href="https://github.com" style="color: white; font-weight: bold; text-decoration: none;">Aishah</a>
        </p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
